<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lesson Ready{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ url_for('home') }}" class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        Lesson Ready
      </a>
      <nav aria-label="Main navigation">
        {% set page = request.endpoint or '' %}
        <a href="{{ url_for('teacher_home') }}"{% if page.startswith('teacher_') %} aria-current="{{ 'page' if page == 'teacher_home' else 'true' }}"{% endif %}>Teacher</a>
        <a href="{{ url_for('student_join') }}"{% if page.startswith('student_') %} aria-current="{{ 'page' if page == 'student_join' else 'true' }}"{% endif %}>Student</a>
      </nav>
    </div>
  </header>

  <main id="main" class="shell {% block layout %}{% endblock %}" tabindex="-1">
    {% for message in get_flashed_messages() %}
      <div class="flash" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script>
    document.querySelectorAll('form[data-ai]').forEach(form => {
      const button = form.querySelector('button[type=submit]');
      const status = form.querySelector('[role=status]');
      const label = button.textContent;

      form.addEventListener('submit', () => {
        button.disabled = true;
        button.textContent = 'Generating…';
        status.textContent = 'AI is working. This may take up to a minute.';
      });

      window.addEventListener('pageshow', () => {
        button.disabled = false;
        button.textContent = label;
        status.textContent = '';
      });
    });
  </script>
</body>
</html>
