<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lesson Ready{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a href="{{ url_for('home') }}" class="brand">Lesson Ready</a>
    <span class="tag">AI suggests · teacher decides</span>
  </header>
  <main>
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Show a "please wait" message while the AI is working.
    document.querySelectorAll('form[data-ai]').forEach(f => f.addEventListener('submit', () => {
      const b = f.querySelector('button[type=submit]');
      if (b) { b.disabled = true; b.textContent = 'AI is working… (up to a minute)'; }
    }));
  </script>
</body>
</html>
